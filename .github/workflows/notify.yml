name: Notifiche e backup

on:
  schedule:
    - cron: '7 * * * *'      # ogni ora, al minuto 7
  workflow_dispatch:
    inputs:
      backup:
        description: 'Esegui anche il backup cifrato'
        type: boolean
        default: false

permissions:
  contents: write            # per salvare i backup cifrati
  actions: write             # per tenere vivo il workflow (GitHub lo disattiva dopo 60 giorni di inattività)

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.VAPID_PRIVATE_KEY != '' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret mancanti
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Notifiche non attive: aggiungi i secret FIREBASE_SERVICE_ACCOUNT e VAPID_PRIVATE_KEY (vedi README)."

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22

      - name: Installa dipendenze
        if: env.HAS_SECRETS == 'true'
        run: npm install --omit=dev --no-audit --no-fund

      - name: Controllo notifiche
        if: env.HAS_SECRETS == 'true'
        run: node scripts/notify.mjs

      - name: Backup cifrato (domenica notte o su richiesta)
        if: env.HAS_SECRETS == 'true' && env.BACKUP_PASSPHRASE != '' && (github.event.inputs.backup == 'true' || (github.event_name == 'schedule' && contains(github.event.schedule, '7 * * * *') && github.run_attempt == 1))
        run: |
          if [ "${{ github.event.inputs.backup }}" = "true" ] || { [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "02" ]; }; then
            node scripts/backup.mjs
            git config user.name "tidyhouse-bot"
            git config user.email "actions@users.noreply.github.com"
            git add backups
            git diff --cached --quiet || { git commit -m "Backup cifrato" && git push; }
          fi

      - name: Tieni vivo il workflow
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable"
